[package]
name = "draft-render"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.102"
fastrand = "2.4.1"
glam = { version = "0.33.0", features = ["zerocopy"] }
gltf = "1.4.1"
image = "0.25"
minifb = "0.28.0"
rayon = "1.12"
zerocopy = { version = "0.8.50", features = ["derive", "simd"] }

[profile.release]
opt-level = 3
